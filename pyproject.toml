[project]
name = "h2r-il"
version = "0.1.0"
description = "Imitation learning from annotated human demonstrations — pipeline on LeRobot (pi0, GR00T N1.7)"
requires-python = ">=3.12"
dependencies = [
    "lerobot[pi,groot,training]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h2r_il"]

[tool.uv.sources]
lerobot = { path = "lerobot", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

# Mirrors lerobot's own uv config: a dependency's [tool.uv] is not applied
# transitively, so the cu128 index must be declared at this root.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
